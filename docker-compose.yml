services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-checkmate_user}:${POSTGRES_PASSWORD:-checkmate_pass}@db:5432/${POSTGRES_DB:-checkmate_db}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_for_development}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-checkmate_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-checkmate_pass}
      - POSTGRES_DB=${POSTGRES_DB:-checkmate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkmate_user} -d ${POSTGRES_DB:-checkmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
